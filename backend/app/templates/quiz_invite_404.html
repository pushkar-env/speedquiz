<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpeedQuiz — quiz not found</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0b1210;
      --fg: #e8f0ec;
      --muted: #9bb0a4;
      --accent: #3dd68c;
      --card: #14201a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    main {
      width: min(380px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 32px 24px;
    }
    .brand {
      letter-spacing: 0.18em;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 14px;
    }
    h1 { margin: 0 0 10px; font-size: 1.5rem; font-weight: 800; }
    p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p class="brand">SPEEDQUIZ</p>
    <h1>This quiz isn’t available</h1>
    <p>
      The code may be mistyped, or the author may have made the quiz private or
      retired it. Ask them for a fresh link.
    </p>
  </main>
</body>
</html>
