name: speedquiz
description: SpeedQuiz — AI-powered quiz game for Android and iOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino widget localizations (date pickers, text selection
  # menus, semantics) for every locale the app ships in.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  equatable: ^2.0.7
  share_plus: ^13.3.0
  app_links: ^7.2.1
  in_app_purchase: ^3.3.0
  # Referenced directly for the platform-specific purchase params: Play needs
  # ChangeSubscriptionParam to make a plan switch replace the old subscription
  # instead of running two, and both stores need the account id passed through.
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11
  google_sign_in: ^7.2.0
  audioplayers: ^6.8.1
  # Live match channel. The socket carries match events only; answers still go
  # over HTTP, so a dropped connection can never lose a submitted answer.
  web_socket_channel: ^3.0.3
  # Push for challenges. Initialized from --dart-define values rather than a
  # bundled google-services.json, so a build without a Firebase project still
  # compiles and runs — it just cannot receive push. See `PushService`.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  # Opens the store-managed subscription screen — the only place a user can
  # cancel or fix a failed payment method.
  url_launcher: ^6.3.2
  # On-device reminders — the daily challenge, a streak about to lapse, a
  # nudge back after a few quiet days. Entirely local: these are scheduled by
  # the app against the phone's own clock and need no Firebase project and no
  # server round trip, which is what makes them work on a build with push
  # switched off. See `LocalNotificationService`.
  flutter_local_notifications: ^22.3.0
  # `zonedSchedule` needs a real tz database, and the device's IANA zone name
  # is the only way to get one that survives a DST boundary — "19:00" has to
  # stay 19:00 in October.
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_math_fork: ^0.7.4
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  # Typefaces are bundled (not fetched at runtime) so first launch never
  # flashes a fallback font and the app renders correctly offline.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
